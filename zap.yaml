env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - https://miru-franco.vercel.app
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 1
    url: https://miru-franco.vercel.app
  type: spider
- parameters:
    maxDuration: 1
    url: https://miru-franco.vercel.app
  type: spiderAjax
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules:
  - action: IGNORE
    customMessage: ''
    id: 90004
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: /zap/wrk/report_zap_local.html
    reportTitle: ZAP Scanning Report
    template: traditional-html
  type: report
