# CI: se ejecuta en cada push y en pull requests
# Los resultados aparecen en la pestaña "Actions" del repositorio en GitHub

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    name: Lint y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Variables que Next puede necesitar en build (ajusta si usas env)
          NEXT_PUBLIC_APP_URL: https://www.mirufranco.com
          NEXT_PUBLIC_API_URL: https://miru-franco.onrender.com

  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci
      - name: Detectar si hay pruebas reales
        id: tests
        run: |
          TEST_SCRIPT=$(node -e "const p=require('./package.json'); console.log((p.scripts&&p.scripts.test)||'')")
          echo "script=$TEST_SCRIPT" >> "$GITHUB_OUTPUT"
          if [ -z "$TEST_SCRIPT" ] || [ "$TEST_SCRIPT" = "npm run lint" ]; then
            echo "has_real_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_real_tests=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ejecutar pruebas
        if: steps.tests.outputs.has_real_tests == 'true'
        run: npm test
      - name: Omitir pruebas (no configuradas)
        if: steps.tests.outputs.has_real_tests != 'true'
        run: echo "No hay pruebas unitarias/integracion configuradas. Se omite este job."
