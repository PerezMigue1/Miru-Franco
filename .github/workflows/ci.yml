# CI: se ejecuta en cada push y en pull requests
# Los resultados aparecen en la pestaña "Actions" del repositorio en GitHub

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    name: Lint y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Variables que Next puede necesitar en build (ajusta si usas env)
          NEXT_PUBLIC_APP_URL: https://miru-franco.vercel.app

  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
