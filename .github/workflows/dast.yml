# DAST = Dynamic Application Security Testing
# Prueba la aplicación DESPLEGADA (staging/producción) con OWASP ZAP.

name: DAST (OWASP ZAP)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Ejecutar manualmente cuando ya tengas la app desplegada

jobs:
  dast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check DAST target URL
        run: |
          if [ -z "${{ secrets.DAST_TARGET_URL }}" ]; then
            echo "::warning::No está configurado el secreto DAST_TARGET_URL. Añádelo en Settings → Secrets → Actions (ej. https://tu-app.vercel.app)"
            exit 1
          fi
          echo "DAST apuntará a la URL configurada en DAST_TARGET_URL"

      - name: Clean previous local report
        run: rm -f report_html.html

      # Escaneo DAST contra la URL desplegada (definida en el secreto DAST_TARGET_URL)
      - name: OWASP ZAP Baseline Scan (deployed app)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.DAST_TARGET_URL }}
          cmd_options: '-a -j'
        continue-on-error: true

      - name: Validate fresh ZAP report exists
        run: |
          if [ ! -f report_html.html ]; then
            echo "No se generó report_html.html nuevo"
            exit 1
          fi
          echo "Reporte generado correctamente:"
          ls -l report_html.html

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30
