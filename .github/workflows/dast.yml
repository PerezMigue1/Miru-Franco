# DAST = Dynamic Application Security Testing
# Prueba la aplicación DESPLEGADA (staging/producción) con OWASP ZAP.

name: DAST - OWASP ZAP Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL desplegada a escanear (ej. https://miru-franco.vercel.app)'
        required: false
        type: string
  push:
    branches: [main]

jobs:
  dast:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve DAST target URL
        id: resolve_target
        run: |
          TARGET_INPUT="${{ github.event.inputs.target_url }}"
          TARGET_SECRET="${{ secrets.DAST_TARGET_URL }}"
          TARGET_URL="${TARGET_INPUT:-$TARGET_SECRET}"

          if [ -z "$TARGET_URL" ]; then
            echo "::error::No hay URL objetivo. Define workflow input target_url o el secreto DAST_TARGET_URL."
            exit 1
          fi

          if [[ ! "$TARGET_URL" =~ ^https?:// ]]; then
            echo "::error::DAST_TARGET_URL debe iniciar con http:// o https://"
            exit 1
          fi

          echo "target_url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "DAST apuntará a: $TARGET_URL"

      - name: Clean previous local report
        run: rm -f report_html.html

      # Escaneo DAST contra la URL desplegada (definida en el secreto DAST_TARGET_URL)
      - name: OWASP ZAP Baseline Scan (deployed app)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.resolve_target.outputs.target_url }}
          cmd_options: '-a -j'
        continue-on-error: true

      - name: Validate fresh ZAP report exists
        run: |
          if [ ! -f report_html.html ]; then
            echo "No se generó report_html.html nuevo"
            exit 1
          fi
          echo "Reporte generado correctamente:"
          ls -l report_html.html

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30
