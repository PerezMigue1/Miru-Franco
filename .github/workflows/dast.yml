# DAST = Dynamic Application Security Testing
# Prueba la aplicación DESPLEGADA (staging/producción) con OWASP ZAP.

name: DAST - OWASP ZAP Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL desplegada a escanear (producción: https://www.mirufranco.com)'
        required: false
        type: string
  push:
    branches: [main]

jobs:
  dast:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve DAST target URL
        id: resolve_target
        run: |
          TARGET_INPUT="${{ github.event.inputs.target_url }}"
          TARGET_SECRET="${{ secrets.DAST_TARGET_URL }}"
          TARGET_URL="${TARGET_INPUT:-$TARGET_SECRET}"

          if [ -z "$TARGET_URL" ]; then
            echo "::error::No hay URL objetivo. Define workflow input target_url o el secreto DAST_TARGET_URL."
            exit 1
          fi

          if [[ ! "$TARGET_URL" =~ ^https?:// ]]; then
            echo "::error::DAST_TARGET_URL debe iniciar con http:// o https://"
            exit 1
          fi

          echo "target_url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "DAST apuntará a: $TARGET_URL"

      - name: Clean previous local reports
        run: rm -f report_*

      - name: Check if ZAP rules file exists
        id: zap_rules
        run: |
          if [ -f .zap/rules.tsv ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Usando .zap/rules.tsv"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No se encontró .zap/rules.tsv; se ejecutará ZAP sin reglas personalizadas."
          fi

      # Escaneo DAST contra la URL desplegada (definida en el secreto DAST_TARGET_URL)
      - name: OWASP ZAP Baseline Scan (Docker CLI)
        run: |
          set -o pipefail
          TARGET_URL="${{ steps.resolve_target.outputs.target_url }}"
          RULES_OPT=""
          if [ "${{ steps.zap_rules.outputs.found }}" = "true" ]; then
            RULES_OPT="-c /zap/wrk/.zap/rules.tsv"
          fi

          echo "Ejecutando ZAP baseline para: $TARGET_URL"
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm --user root -v "$(pwd):/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "$TARGET_URL" \
            -a -j \
            $RULES_OPT \
            -r report_html.html \
            -w report_md.md \
            -J report_json.json \
            -x report_xml.xml | tee zap-baseline.log
        continue-on-error: true

      - name: Inspect generated ZAP reports
        id: reports
        run: |
          echo "Buscando reportes generados por ZAP..."
          ls -la report_* 2>/dev/null || true
          if compgen -G "report_*" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Se encontraron reportes ZAP."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::error::ZAP no generó archivos report_* en esta ejecución."
            if [ -f zap-baseline.log ]; then
              echo "Últimas líneas de zap-baseline.log:"
              tail -n 80 zap-baseline.log || true
            fi
            exit 1
          fi

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_*
            zap-baseline.log
          if-no-files-found: warn
          retention-days: 30
