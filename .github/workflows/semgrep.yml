# SAST con Semgrep AppSec Platform (semgrep.dev).
# Las reglas y políticas (OWASP, JS, TS, React, etc.) se activan en la web: Settings / Deployment,
# no en este archivo. El token conecta el job con tu proyecto en Semgrep Cloud.
#
# Requisito: en GitHub → Settings → Secrets → Actions, crea SEMGREP_APP_TOKEN
# (Semgrep → Settings → Tokens, o el asistente "Add to CI" / "Scan new project").

name: SAST - Semgrep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep/ci → Semgrep Cloud
    runs-on: ubuntu-latest
    # Evita fallos de permisos en PRs de Dependabot
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan (Semgrep Cloud + SARIF local)
        run: |
          docker run --rm \
            -e SEMGREP_APP_TOKEN \
            -e SEMGREP_BRANCH="${GITHUB_REF_NAME}" \
            -e SEMGREP_COMMIT="${GITHUB_SHA}" \
            -e SEMGREP_JOB_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -e SEMGREP_REPO_NAME="${GITHUB_REPOSITORY}" \
            -e SEMGREP_REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -e SEMGREP_PR_ID="${{ github.event.pull_request.number }}" \
            -v "${GITHUB_WORKSPACE}:/src" \
            --workdir /src \
            semgrep/semgrep:latest \
            semgrep ci --sarif --sarif-output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # Si el scan falla antes de generar el archivo, este paso no debe tumbar el workflow.
      - name: Upload SARIF to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
